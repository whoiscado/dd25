name: Duo Watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Min (GitHub verzögert teils um ein paar Min)
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Test-Push senden"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test-Push
        if: ${{ inputs.test }}
        run: python duo_watcher.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Verfügbarkeit prüfen
        if: ${{ !inputs.test }}
        run: python duo_watcher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
